<body class="igx-typography igx-scrollbar">

  <!-- Splash screen -->
  <fuse-splash-screen>
    <img id="logoImage" alt="Logo image" style="display: none;">
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </fuse-splash-screen>

  <!-- App root -->
  <app-root></app-root>
  <app-redirect></app-redirect>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const logoImage = document.getElementById('logoImage');
      const logo = localStorage.getItem('logo');

      logoImage.style.transition = 'opacity 0.5s ease-in-out'; // Define opacity transition

      if (logo) {

        const img = new Image();
        img.onload = function () {
          logoImage.src = img.src;
          logoImage.style.display = 'block';
          logoImage.style.width = '300px';
          logoImage.style.height = 'auto';
          logoImage.style.marginBottom = '30px';
        };
        img.src = logo; // Preload the image
      } else {
        logoImage.src = 'assets/images/logo/scouts.png';
      }
    });

  </script>
