<html lang="en">

<head>
  <title>The Scouts</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <base href="./">

  <!-- Favicon -->
  <link rel="icon" type="image" href="./assets/images/logo/scou_1.png">
  <link rel="icon" type="image" href="./assets/images/logo/scouts.png">

  <!-- Fonts -->
  <link href="assets/fonts/inter/inter.css" rel="stylesheet">

  <link href="https://fonts.gstatic.com" rel="preconnect">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Icon fonts -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Splash screen styles -->
  <link href="assets/styles/splash-screen.css" rel="stylesheet">

  <!-- CSS only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"

  <!--Font Awesome icons-->
  <link href="//netdna.bootstrapcdn.com/font-awesome/3.2.1/css/font-awesome.css" rel="stylesheet">
</head>

<body class="igx-typography igx-scrollbar">

  <!-- Splash screen -->
  <fuse-splash-screen>
    <img id="logoImage" alt="Logo image" style="display: none;" />
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </fuse-splash-screen>

  <!-- App root -->
  <app-root></app-root>
  <app-redirect></app-redirect>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const logoImage = document.getElementById('logoImage');
      const logo = localStorage.getItem('logo');

      logoImage.style.transition = 'opacity 0.5s ease-in-out'; // Define opacity transition

      if (logo) {

        const img = new Image();
        img.onload = function () {
          logoImage.src = img.src;
          logoImage.style.display = 'block';
          logoImage.style.width = '300px';
          logoImage.style.height = 'auto';
          logoImage.style.marginBottom = '30px';
        };
        img.src = logo; // Preload the image
      } else {
        logoImage.src = 'assets/images/logo/scouts.png';
      }
    });

  </script>

  <script
    src="https://maps.google.com/maps/api/js?v=3.51&key=AIzaSyCDFSak5czCvHjYNhIg0puzcFVzWAc2TPw&libraries=places&callback=Function.prototype"></script>
  <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
    integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
    crossorigin="anonymous"></script>

  <script src="https://cdn.rawgit.com/google/code-prettify/master/loader/run_prettify.js?skin=sunburst"></script>

</body>

</html>
