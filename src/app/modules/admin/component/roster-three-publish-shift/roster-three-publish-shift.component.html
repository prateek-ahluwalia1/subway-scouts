<div class="roster-three-publish">
    <h4 mat-dialog-title>Changes to Publish Shift</h4>
    <div mat-dialog-content>Saving your current changes will result immediately publishing shedule changes to the staff
        visited below</div>
    <div mat-dialog-content>
        <h6 mat-dialog-title class="mt-2">Choose the notification method</h6>

        <section class="example-section-roster-three mt-2">
            <mat-checkbox class="example-margin" [(ngModel)]="email">Eamil</mat-checkbox>
            <mat-checkbox class="example-margin" [(ngModel)]="mobile_app">Mobile App</mat-checkbox>
            <mat-checkbox class="example-margin" [(ngModel)]="sms">SMS</mat-checkbox>
        </section>
    </div>
    <div mat-dialog-actions class="mat-dialog-actions">

        <button mat-button mat-dialog-close (click)="onCloseClick()">Close</button>
        <button mat-button mat-dialog-save class="savepublish">Save & Publish</button>
    </div>
</div>
