<div class="w-100 mt-3 pe-3 d-flex justify-content-end">
    <mat-icon role="button" (click)="close()">close</mat-icon>
</div>
<div class="modal-body" #pdfTable>
    <h2 style="margin-bottom: 10px;">{{ staff?.name }}</h2>
    <table class="w-100" style="width: 100%;">
        <tr style="width: 100%;">
            <th>Action</th>
            <th>Date</th>
            <th>Reason</th>
            <th>Changed By</th>
        </tr>
        <tr *ngFor="let item of res?.data; let i=index" style="width: 100%;">
            <td>{{ item.action_type }}</td>
            <td>{{ item.date }} </td>
            <td>{{ item.reason }}</td>
            <td class="text-capitalize"> {{ item.action_by }}</td>
        </tr>
    </table>

</div>

<div class="modal-footer">
    <!-- <button type="button" class="btn btn-success" (click)="downloadAsPDF()">Download PDF</button> -->
    <button type="button" class="btn btn-success" (click)="downloadAsCSV()">Download CSV</button>
</div>
