<div class="absolute inset-0 flex flex-col overflow-hidden  main-body-watermark">
    <div class="flex-auto p-6 overflow-auto">
        <div class="h-350 min-h-350 p-4 bg-white max-h-350 rounded-2xl">
            <div class="d-flex mb-4 justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <h4 class="me-1">Recordings</h4> <img style="height: 17px; width: 17px;"
                        src="assets/icons/Group 293.png" alt="">
                </div>
                <!-- <img style="height: 21px; width: 21px;" src="assets/icons/imgpsh_fullsize_anim (1).png" alt=""> -->

            </div>

            <div class="d-flex mb-3 justify-content-between" style="margin-left: 2%; margin-right: 2%;">
                <mat-form-field class="w-25">
                    <mat-icon class="border-end border-secondary p-3 me-3">person</mat-icon>
                    <input matInput placeholder="Search Records..." [(ngModel)]="searchTerm">
                    <button mat-button matSuffix>
                        <mat-icon>search</mat-icon>
                    </button>
                </mat-form-field>
                <mat-form-field class="w-25" appearance="fill">
                    <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
                        <input matStartDate formControlName="start" placeholder="Start date">
                        <input matEndDate formControlName="end" placeholder="End date">
                    </mat-date-range-input>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-date-range-picker #picker></mat-date-range-picker>
                    <mat-error *ngIf="range.controls.start.hasError('matStartDateInvalid')">Invalid start
                        date</mat-error>
                    <mat-error *ngIf="range.controls.end.hasError('matEndDateInvalid')">Invalid end date</mat-error>
                </mat-form-field>
            </div>


            <mat-card class="mt-2" *ngFor="let record of records; let i= index"
                style="margin-left: 2%; margin-right:2%;">
                <mat-card-content>
                    <div class="d-flex ">
                        <div class="info">
                            <div class="d-flex justify-content-between">
                                <span class="name">{{record.name}}</span>
                                <!-- <mat-icon svgIcon="heroicons_outline:dots-horizontal"></mat-icon> -->
                            </div>
                            <span class="phone">{{record.raw_digits}}</span>
                            <div class="d-flex justify-content-between">
                                <p>{{ record.started_at | date: 'dd/MM/yyyy, HH:mm:ss a' }}</p>
                                <!-- <p>{{record.answered_at}}</p> -->
                                <p>{{ record.ended_at | date: 'dd/MM/yyyy, HH:mm:ss a'}}</p>
                            </div>
                        </div>
                    </div>
                    <audio controls *ngIf="record.audio">
                        <source [src]="record.audio" type="audio/ogg">
                        <source [src]="record.audio" type="audio/mpeg">
                        <source [src]="record.audio" type="audio/wav">
                        <source [src]="record.audio" type="audio/mp3">
                        Your browser does not support the audio element.
                    </audio>

                </mat-card-content>
            </mat-card>
            <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageIndex]="currentPage"
                (page)="pageChanged($event)">
            </mat-paginator>


        </div>
    </div>
</div>
