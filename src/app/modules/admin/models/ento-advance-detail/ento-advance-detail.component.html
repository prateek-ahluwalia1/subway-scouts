  <!-- an hidden div is created to set the position of appearance of the menu
  <ng-template #content let-modal>
    <div class="row modal-creat-shift">
        <div class="col-3">
            <img src="https://mdbootstrap.com/img/new/avatars/8.jpg" alt="" style="width: 70px; height: 70px"
                class="rounded-circle" />
            <div class="select-guard-detail pb-2">
                <h4>Usman Bhatti</h4>
            </div>

            <div class="roster-stat pb20">
                <div class="modal-side-element">
                    <fa-icon [icon]="calenderIcon"></fa-icon>
                    <div class="shitplushor">
                        <p><b>0</b></p>
                        <p>Shift Weekly Hours</p>
                    </div>
                </div>
            </div>
            <div class="roster-stat pb20">
                <div class="modal-side-element">
                    <fa-icon [icon]="faClock"></fa-icon>
                    <div class="shitplushor">
                        <p><b>7.5</b></p>
                        <p>Shift Length</p>
                    </div>
                </div>
            </div>
            <div class="roster-stat pb20">
                <div class="modal-side-element">
                    <fa-icon [icon]="faUser"></fa-icon>
                    <div class="shitplushor">
                        <p><b>0</b></p>
                        <p>Shift Cost</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-9">
            <div class="modal-header">
                <h4 class="modal-title">New Shift on Thu 24 Nov</h4>
                <button type="button" class="btn-close" aria-label="Close"
                    (click)="modal.dismiss('Cross click')"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="addShiftAdvanceForm">
                    <div class="row pb-1">
                        <div class="col-lg-6">
                            <mdb-form-control>
                                <label mdbLabel class="form-label" for="form1">Site Name</label>
                                <input mdbInput class="form-control" formControlName="site_name" id="site_name"
                                    type="text" placeholder="Site Name" aria-label="readonly input example"
                                    [readonly]="true" />
                            </mdb-form-control>
                        </div>
                        <div class="col-lg-6">
                            <label mdbLabel class="form-label" for="form1">Who is working?</label>
                            <select class="form-control" name="select_guard" id="select_guard"
                                formControlName="select_guard">
                                <option *ngFor="let guard of guards" [ngValue]="guard">{{guard}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="row pb-1 mt-2">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label for="select_guard">Start Time</label>
                                <div class="ngx-timepicker-field-example">
                                    <ngx-timepicker-field [controlOnly]="true" [format]="24"
                                        [defaultTime]="'00:00'"></ngx-timepicker-field>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label for="select_guard">Start Time</label>
                                <div class="ngx-timepicker-field-example">
                                    <ngx-timepicker-field [controlOnly]="true" [format]="24"
                                        [defaultTime]="'00:00'"></ngx-timepicker-field>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="hideShowBreakP" (click)=toggleDisplayDivIf()>
                        <mat-icon *ngIf="!isShowbreak" svgIcon="mat_solid:keyboard_arrow_down"></mat-icon>
                        <mat-icon *ngIf="isShowbreak" class="date_left_right">keyboard_arrow_right</mat-icon>Shift
                        Details
                    </p>
                    <div class="row px-4" *ngIf="!isShowbreak">
                        <div class="col-lg-6">
                            <p>Shift Payable</p>
                            <div class="yes-no">
                                <p>
                                    <input type="radio" name="shift_payable" formControlName="shift_payable"
                                        value="yes">
                                    <label for="test1">Yes</label>
                                </p>
                                <p>
                                    <input type="radio" name="shift_payable" formControlName="shift_payable"
                                        value="no">
                                    <label for="test2">No</label>
                                </p>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <p>Shift Chargeable</p>
                            <div class="yes-no">
                                <p>
                                    <input type="radio" name="shift_chargeable" formControlName="shift_chargeable"
                                        value="yes">
                                    <label for="test3">Yes</label>
                                </p>
                                <p>
                                    <input type="radio" name="shift_chargeable" formControlName="shift_chargeable"
                                        value="no">
                                    <label for="test4">No</label>
                                </p>
                            </div>
                        </div>
                    </div>
                    <p class="hideShowCustomP" (click)=toggleCustomRates()>
                        <mat-icon *ngIf="!isShowCustomRates" svgIcon="mat_solid:keyboard_arrow_down"></mat-icon>
                        <mat-icon *ngIf="isShowCustomRates" class="date_left_right">keyboard_arrow_right</mat-icon>
                        Custome Rates
                    </p>
                    <div class="row px-4" *ngIf="!isShowCustomRates">
                        <div class="col-6">
                            <mat-card-content>
                                <section class="example-section">
                                    <mat-checkbox class="example-margin" name="" (click)="enabledCustomRates()">
                                        Enable
                                    </mat-checkbox>
                                </section>
                            </mat-card-content>
                        </div>

                    </div>
                    <div class="row px-4 custome-rates" *ngIf="isShowCustomRatesField">
                        <div class="col-6">
                            <mat-form-field appearance="outline">
                                <mat-label>Payrates Level</mat-label>
                                <mat-select formControlName="payrate_level" name="payrate_level">
                                    <mat-option>None</mat-option>
                                    <mat-option>1</mat-option>
                                </mat-select>
                            </mat-form-field>
                            <mat-form-field appearance="outline">
                                <mat-label>Chargerates Level</mat-label>
                                <mat-select formControlName="chargerate_lavel" name="chargerate_lavel">
                                    <mat-option>None</mat-option>
                                    <mat-option></mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col-6">
                            <mat-form-field appearance="outline">
                                <mat-label>Payrates</mat-label>
                                <mat-select formControlName="payrate" name="payrate">
                                    <mat-option>None</mat-option>
                                    <mat-option></mat-option>
                                </mat-select>
                            </mat-form-field>
                            <mat-form-field appearance="outline">
                                <mat-label>Chargerates</mat-label>
                                <mat-select formControlName="chargerate" name="chargerate">
                                    <mat-option>None</mat-option>
                                    <mat-option></mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>
                    <p class="hideShowOthers" (click)=toggleOthers()>
                        <mat-icon *ngIf="!isShowOthersDetail" svgIcon="mat_solid:keyboard_arrow_down"></mat-icon>
                        <mat-icon *ngIf="isShowOthersDetail" class="date_left_right">keyboard_arrow_right</mat-icon>
                        Other Details
                    </p>
                    <div class="row px-4 otherDetailDiv" *ngIf="!isShowOthersDetail">
                        <div class="col-12">
                            <div class="yes-no">
                                <p>Un-published Shift</p>
                                <p class="yes-no1">
                                    <input type="radio" id="unpublished_shift1" formControlName="unpublished_shift"
                                        value="yes">
                                    <label for="test1">Yes</label>
                                </p>
                                <p class="yes-no2">
                                    <input type="radio" value="no" id="unpublished_shift2"
                                        formControlName="unpublished_shift">
                                    <label for="test2">No</label>
                                </p>
                            </div>
                        </div>
                        <div class="col-12">
                            <mat-card-content>
                                <section class="example-section">
                                    <mat-checkbox class="example-margin" formControlName="public_holiday"
                                        name="public_holiday">Public Holidays
                                    </mat-checkbox>
                                    <mat-checkbox class="example-margin" formControlName="covid_marshal"
                                        name="covid_marshal">Covid Marshal
                                    </mat-checkbox>
                                </section>
                            </mat-card-content>
                        </div>
                        <div class="col-12">
                            <mat-card-content>
                                <section class="example-section">
                                    <mat-checkbox class="example-margin" formControlName="training" id="training">
                                        Training
                                    </mat-checkbox>
                                    <mat-checkbox class="example-margin" formControlName="continuation"
                                        id="continuation">Continuation
                                    </mat-checkbox>
                                </section>
                            </mat-card-content>
                        </div>
                        <div class="col-12">
                            <mat-card-content>
                                <section class="example-section">
                                    <mat-checkbox class="example-margin" formControlName="overtime_enabled"
                                        id="overtime_enabled" (click)=toggleOverTime()>OverTime
                                    </mat-checkbox>
                                    <mat-checkbox class="example-margin" formControlName="travel_time"
                                        id="traveltime_enabled" (click)=toggleTravelTime()>Travel Time
                                    </mat-checkbox>
                                </section>
                            </mat-card-content>

                        </div>
                        <div class="col-12">
                            <mat-form-field appearance="outline" *ngIf="isShowOverTime">
                                <mat-label>Overtime Value</mat-label>
                                <mat-select formControlName="overtime_value" id="overtime_value">
                                    <mat-option>None</mat-option>
                                    <mat-option value="1">1</mat-option>
                                </mat-select>
                            </mat-form-field>
                            <mat-form-field appearance="outline" *ngIf="isCheckedTravelTime">
                                <mat-label>Travel Time</mat-label>
                                <mat-select formControlName="travel_time" id="travel_time">
                                    <mat-option>None</mat-option>
                                    <mat-option></mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" (click)="submitShftAdvanceForm()">Submit</button>
                <button type="button" class="btn btn-light" (click)="modal.close('Close click')">Close</button>
            </div>
        </div>
    </div>

</ng-template> -->
