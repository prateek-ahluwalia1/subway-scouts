<div class="modal-header">
    <h4 class="modal-title">Create New</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
</div>

<form [formGroup]="CreateAlarmSystem">

    <div class="modal-body">
        <div class="row">
            <mat-form-field appearance="outline" class="selection">
                <mat-label>Alarm Dispatch System Name</mat-label>
                <input matInput id="numberInput" formControlName="name">
            </mat-form-field>
        </div>

        <div class="row">
            <mat-form-field appearance="outline" class="selection">
                <mat-label>Select Locations</mat-label>
                <mat-select formControlName="location_id" (selectionChange)="onSiteSelectionChange($event)">
                    <mat-option *ngFor="let loc of patrollingLocations" [value]="loc.id">{{loc.site_name}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="row mt-2" *ngIf="keysArray && keysArray.length > 0">
            <h6 style="text-decoration: underline;">Key Details</h6>
        </div>

        <div class="rows-containers" formArrayName="keys" *ngIf="keysArray && keysArray.length > 0">
            <div *ngFor="let key of keys.controls; let i = index" [formGroupName]="i">
                <div class="row mt-2">
                    <div class="col-4">
                        Key Name:
                        <mat-form-field appearance="outline" class="selection">
                            <input matInput id="numberInput" formControlName="key_name" readonly>
                        </mat-form-field>
                    </div>

                    <div class="col-4 p-0">
                        Key Value: 
                        <mat-form-field appearance="outline" class="selection">
                            <input matInput id="numberInput" formControlName="key_number" readonly><br>
                        </mat-form-field>
                    </div>
        
                    <div class="col-2">
                        Image:
                        <div class="keyimage">
                            <img onerror='this.src="https://via.placeholder.com/150"'
                                [src]="key.value.key_path" alt="">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-2" *ngIf="alarmsArray && alarmsArray.length > 0">
            <h6 style="text-decoration: underline;">Alarm Panel Details</h6>
        </div>

        <div class="rows-containers" formArrayName="alarm_panels" *ngIf="alarmsArray && alarmsArray.length > 0">
            <div *ngFor="let alarm of alarm_panels.controls; let i = index" [formGroupName]="i">
                <div class="row mt-2">
                    <div class="col-8">
                        Alarm Panel Code:
                        <mat-form-field appearance="outline" class="selection">
                            <input matInput id="numberInput" formControlName="alarm_panel_codes" readonly><br>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </div>

        <!-- <div class="row mt-2">
            <mat-label>AI Recommended Patrol Car</mat-label>
            <mat-slide-toggle>Patrol Car 1</mat-slide-toggle>
            <mat-slide-toggle>Patrol Car 2</mat-slide-toggle>
        </div> -->

        <div class="row mt-2">
            <div class="col-8">
                <mat-form-field appearance="outline" class="selection" style="width: 100%;">
                    <mat-label>Alarm Docket Number</mat-label>
                    <input matInput id="numberInput" formControlName="docket_number"><br>
                </mat-form-field>
            </div>

            <div class="col-4" style="margin-top: 10px;">
                <button type="button" class="btn" (click)="randomValue();">Generate Docket
                </button>
            </div>
        </div>



        <div class="row mt-2">
            <mat-form-field appearance="outline" class="selection">
                <mat-label>Select Patrol Car</mat-label>
                <mat-select formControlName="car_id">
                    <mat-option *ngFor="let car of patrolCar" [value]="car.id">{{car.name}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    
        <div class="row ml-1 mr-1 mt-2" *ngIf="!alarm_file">
            <input class="form-control" type="file" (change)="uploadAlarmDispatchFile($event)"
                placeholder="Instrcutions File" accept=".jpg,.jpeg,.pdf">
        </div>

        <div class="row" *ngIf="alarm_file">
            <div class="row pb-1 mt-1 d-flex">
                <div class="col-3">
                    <button (click)="viewFile()" mat-button color="accent" style="border: 1px solid; border-radius: 10px;"><mat-icon
                            svgIcon="mat_outline:attach_file"></mat-icon>{{ alarm_file_name
                        }}</button>
                </div>
                <div class="col-4">
                    <mat-icon (click)="handleFileInput()" style="width:25px;height:25px"
                        svgIcon="mat_outline:drive_file_rename_outline"></mat-icon>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Close</button>
        <button type="button" class="btn btn-secondary" (click)="Submit()">Publish</button>
    </div>

</form>
