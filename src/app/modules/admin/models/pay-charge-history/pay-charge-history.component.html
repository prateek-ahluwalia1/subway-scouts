<div class="modal-body">
    <table class="table">
        <thead style="background-color: #DDF4EF;">
            <th>Change By</th>
            <th>Updated At</th>
            <th>Created At</th>
        </thead>
        <tbody>
            <tr *ngFor="let item of history; let i = index">
                <td>{{ item?.changed_by_name }}</td>
                <td>{{ item.updated_at | date:'dd-MM-yyyy' }}</td>
                <td>{{ item.created_at | date:'dd-MM-yyyy'}}</td>
            </tr>

        </tbody>
    </table>
</div>
