<div class="modal-header">
    <h5 class="modal-title m-auto">Copy Shifts From {{ shiftCopyFrom }} To {{ shiftCopyTo }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="close('dismiss')"></button>
</div>
<div class="modal-body">
    <section class="example-section">
        <div class="row mx-4 first-row">
            <p>Select the week(s) you would like to copy the schedule to:</p>
            <div class="col-6">
                <section class="example-section">
                    <mat-checkbox class="example-margin" [(ngModel)]="includeAllNotes">Include All Notes</mat-checkbox>
                </section>
            </div>
            <div class="col-6">
                <section class="example-section-left">
                    <mat-checkbox class="example-margin" [(ngModel)]="includeAllRates">Include Custom
                        Rates</mat-checkbox>
                </section>
            </div>
        </div>
        <span class="example-list-section d-flex justify-content-center">
            <mat-checkbox class="custom-checkbox-1 main-task" [checked]="allComplete" [indeterminate]="someComplete()"
                [ngClass]="{'completed-background': allComplete}" (change)="setAll($event.checked)">
                Select/ Unselect All
            </mat-checkbox>
        </span>
        <span class="example-list-section">
            <ul class="d-flex w-100 justify-content-around mb-0 pl-0" style="text-align: center;">
                <div class="row">
                    <li *ngFor="let subtask of task.subtasks" class="w-50 col-md-6">
                        <mat-checkbox class="custom-checkbox sub-tasks"
                            [ngClass]="{'completed-background': subtask.completed}" [(ngModel)]="subtask.completed"
                            (ngModelChange)="updateAllComplete(subtask)">
                            {{subtask.date}}
                        </mat-checkbox>
                    </li>
                </div>
            </ul>
        </span>
    </section>
</div>
<div class="modal-footer" style="justify-content: space-between;">
    <button type="button" class="btn bg-gray close-btn" (click)="close('dismiss')">Close</button>
    <div class="flex">
        <section class="example-section" style="margin-top: 10px;">
            <mat-checkbox class="example-margin" [(ngModel)]="removeStaff">Remove staff from shifts</mat-checkbox>
        </section>&nbsp;&nbsp;&nbsp;
        <button type="button" class="btn btn-outline-dark" (click)="copyDayandSite()">Next</button>
    </div>
</div>

<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="default" color="#fff" type="line-spin-fade-rotating">
    <p style="color: white">Please Wait...</p>
</ngx-spinner>
