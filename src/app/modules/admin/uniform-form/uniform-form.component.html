<div class="row">
  <div class="col-12">
   <button type="button" (click)="close()" style="float: right; margin-right: 3rem; margin-top: 3rem;">
       <mat-icon>cancel</mat-icon>
   </button>
  </div> 
</div>
<div class="wrap_form">
  <form [formGroup]="AddUniDetail">
  <div class="content" #content>
    <div class="logo ">
      <img src="../../assets/images/logo/scouts.png" alt="" class="mb-2">
    </div>

    <div class="w-100 text-center title mb-5">
      <h2 class="text-break fw-bold">Uniform Form</h2>
    </div>

    <div class="form-1 mb-2">
      <div class="form-group  justify-content-end d-flex">
        <div class=" d-flex w-100">
          <div class="w-50 d-flex justify-content-center">
            <label for="" >Name</label>
            <input type="text" formControlName="name" class="border-bottom ms-2 border-secondary w-75">
          </div>

          <div class="w-50">
            <label for="">Email</label>
            <input type="email" formControlName="email" class="border-bottom ms-2 border-secondary w-75">
          </div>
        </div>
      </div>

      <div class="form-group  justify-content-end d-flex">
        <div class="d-flex w-100">
          <div class="w-50 d-flex justify-content-center">
            <label for="">Address</label>
            <input type="text" formControlName="address" class="border-bottom text-break ps-2 ms-2 border-secondary w-75" style="word-break: break-all;">
          </div>

          <div class="w-50">
            <label for="">Phone</label>
            <input type="string" formControlName="phone" class="border-bottom ps-2 ms-2 border-secondary w-75 no-spin-box">
          </div>
        </div>
      </div>

      <div class="form-group justify-content-end d-flex">
        <div class="d-flex w-100">
          <div class="w-50 d-flex justify-content-center">
            <label for="">Date of Issue</label>
            <input #dateInput type="date" formControlName="issue_date" class="border-bottom ps-2 border-secondary w-75">
          </div>

          <div class="w-50">
            <label for="">Date of Return</label>
            <input #dateInput type="date" formControlName="return_date" class="ps-2 border-bottom border-secondary w-75">
          </div>
        </div>
      </div>

    </div>
    <div class="form-2 ">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Status</th>
            <th scope="col">Uniform Type</th>
            <th scope="col">Uniform Size</th>
            <th scope="col">Uniform Quantity</th>
          </tr>
        </thead>

        <tbody>
          <tr class="text-center" *ngFor="let uniformType of uniformTypes; let i = index">
            <td><input type="checkbox" name="checkbox" [checked]="uniformType.status" (change)="onCheckboxChange(i)"></td>
            <td>{{ uniformType.name }}</td> 
            <td><input type="text" [value]="uniformType.size" (input)="uniformType.size = $event.target.value"></td>
            <td><input type="text" [value]="uniformType.Qty" (input)="uniformType.Qty = $event.target.value"></td>
          </tr>
        </tbody>
      </table>

      <div class="bg-light">
        <label for="" class="fw-bold">Note:</label>
        <div>
          <textarea name="" id="" cols="143" rows="3" formControlName="note"></textarea>
        </div>
      </div>

      <div>
        <div class="d-flex mt-3 w-50">
          <label for="">Signature</label>
          <input type="text" formControlName="sign" class="border-bottom border-secondary w-25">
        </div>
        <label for="" class="mt-2">Date</label>
        <input type="text" formControlName="date" class="border-bottom border-secondary w-25">
      </div>
    </div>
  </div>

  <div class="flex justify-content-center" style="margin-top: 5rem; margin-bottom: 2rem;">
    <button type="button" class="btn btn-success m-1" (click)="makePdf()"
      *ngIf="this.global.admin && this.global.admin.admin_user_type === 'super-admin'">Save pdf</button>
    <button type="button" class="btn btn-success m-1" [disabled]="stafffPermissions && !stafffPermissions.update" (click)="submit()">Submit</button>
  </div>
  </form>
</div>
