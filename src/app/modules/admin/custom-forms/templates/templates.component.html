<div class="flex flex-col flex-auto min-w-0">
    <div class="flex-auto p-6 sm:p-10">
        <div class="flex flex-wrap items-start w-full max-w-400 -m-4">
            <fuse-card *ngFor="let item of templates" class="flex m-2 flex-col max-w-80 w-full filter-article">
                <img class="object-cover" src="assets/images/forms.jpg" alt="Card cover image">
                <div class="m-8 mb-4">
                    <div class="text-2xl font-semibold leading-tight">{{ item.title }}</div>
                    <div class="mt-3 -mx-3">
                        <a class="px-3" mat-button [color]="'primary'" (click)="editForm(item)">
                            Use Template
                        </a>
                    </div>
                </div>
            </fuse-card>
        </div>
    </div>
</div>
