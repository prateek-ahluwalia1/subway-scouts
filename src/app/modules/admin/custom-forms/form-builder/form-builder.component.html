<div class="settings-cog cog-form-builder fixed flex items-center justify-center left-0 shadow-lg rounded-r-lg z-90 cursor-pointer bg-opacity-90 print:hidden"
    [class.lg:left-0]="config?.layout === 'centered' || config?.layout === 'material'"
    [class.lg:left-28]="config?.layout !== 'centered' && config?.layout !== 'material'" style="top: 250px"
    (click)="sidenav.toggle()" *ngIf="!opened">
    <span>Add Form Element</span>
    <mat-icon class="icon-size-5 text-white animate-spin-slow" [svgIcon]="'heroicons_solid:cog'"></mat-icon>
</div>
<div class="absolute inset-0 flex flex-col overflow-hidden main-body-watermark">
    <div class="overflow-auto">
        <div class="navbar-container">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-3 text-center"></div>
                    <div class="col-md-6 text-center">
                        <button class="tab-button" (click)="goBack()">Go Back</button>
                        <button class="tab-button active">Build</button>
                        <button class="tab-button" (click)="publishForm('publish')">Publish</button>
                        <button class="tab-button" (click)="publishForm('template')">Save as Template</button>
                        <button class="tab-button" (click)="openFormSettings()">Form Setting</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="container-fluid py-3"
            style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%;">
            <div>
                <div class="d-flex flex-row"
                    [ngStyle]="{ 'justify-content': !_formService.logo ? 'center' : _formService.logoAlignment }">
                    <div class="header-area-form-builder" [ngStyle]="{ 'width': !_formService.logo ? '60%' : '25%' }">
                        <img *ngIf="_formService.logo" [src]="_formService.logo" class="logo-display"
                            [style.width.%]="_formService.logoSize"
                            (click)="openSettingsPanel({ logo: _formService.logo, type: 'logo' })">
                        <p *ngIf="!_formService.logo" class="add-logo-button" (click)="onAddLogoClick()">
                            ----------------- + ADD YOUR LOGO -----------------</p>
                        <input type="file" #logoInput (change)="onLogoSelected($event)" style="display: none;">
                    </div>
                </div>

                <div class="drop-zone" cdkDropList (cdkDropListDropped)="drop($event)"
                    [style.background-color]="backgroundColor"
                    [style.background-image]="backgroundImage ? 'url(' + backgroundImage + ')' : 'none'"
                    [style.opacity]="backgroundOpacity" [style.color]="textColor">
                    <div *ngFor="let element of formElements; let i = index" @zoomIn cdkDrag
                        [cdkDragHandle]="dragHandle">
                        <div (click)="selectElement(i)" [class.selected]="i === selectedElementIndex"
                            class="form-element">
                            <!-- Element Types Handling -->
                            <div *ngIf="element.type === 'heading'" class="form-group row">
                                <div class="col-12">
                                    <textarea [(ngModel)]="element.label" name="label" class="textarea-inline-control"
                                        cdkTextareaAutosize></textarea>
                                </div>
                                <hr>
                            </div>
                            <div *ngIf="element.type === 'single'" class="form-group row">
                                <div class="col-12">
                                    <label>{{ element.label }}</label>
                                    <input
                                        *ngIf="element?.properties?.inputType && element.name != 'signature' && element.name != 'textarea'"
                                        [type]="element?.properties?.inputType" class="form-control"
                                        [placeholder]="element.placeholder">
                                    <textarea *ngIf="element.name === 'textarea'" class="form-control"
                                        [(ngModel)]="element.label" [id]="element.label" rows="3"></textarea>
                                    <div class="signature-container" *ngIf="element.name === 'signature'">
                                        <signature-pad [options]="signaturePadOptions"></signature-pad>
                                    </div>
                                </div>
                            </div>
                            <div *ngIf="element.type === 'group'" class="row">
                                <ng-container *ngFor="let field of element.fields">
                                    <div class="col-md-6 form-group">
                                        <label>{{ field.label }}</label>
                                        <input [type]="field?.properties?.inputType" class="form-control"
                                            [placeholder]="field.placeholder">
                                    </div>
                                </ng-container>
                            </div>
                            <div *ngIf="element.type === 'dropdown'" class="form-group row">
                                <div class="col-12">
                                    <input [(ngModel)]="element.label" class="form-control mb-2"
                                        placeholder="Dropdown Name">
                                    <ul class="list-group">
                                        <li class="list-group-item"
                                            *ngFor="let option of element.options; let j = index">
                                            <input [(ngModel)]="option.text" class="form-control"
                                                placeholder="Enter option text">
                                            <mat-icon class="form-builder-icon"
                                                (click)="removeOption(element.options, j)"
                                                svgIcon="heroicons_solid:trash" class="action-icon"></mat-icon>
                                        </li>
                                    </ul>
                                    <mat-icon class="form-builder-icon" svgIcon="mat_outline:add_circle"
                                        (click)="addOption(element.options)"></mat-icon>
                                </div>
                            </div>
                            <div *ngIf="element.type === 'checkboxGroup'" class="form-group row">
                                <div class="col-12">
                                    <input [(ngModel)]="element.label" class="form-control mb-2"
                                        placeholder="CheckBox Name">
                                    <ul class="list-group">
                                        <li class="list-group-item"
                                            *ngFor="let option of element.options; let j = index">
                                            <input type="checkbox">
                                            <input [(ngModel)]="option.text" class="form-control"
                                                placeholder="Enter option text">
                                            <mat-icon class="form-builder-icon"
                                                (click)="removeOption(element.options, j)"
                                                svgIcon="heroicons_solid:trash" class="action-icon"></mat-icon>
                                        </li>
                                    </ul>
                                    <mat-icon class="form-builder-icon" svgIcon="mat_outline:add_circle"
                                        (click)="addOption(element.options)"></mat-icon>
                                </div>
                            </div>
                            <div *ngIf="element.type === 'PDFRadioGroup'" class="form-group row">
                                <div class="col-12">
                                    <input [(ngModel)]="element.label" class="form-control mb-2" placeholder="Name">
                                    <ul class="list-group">
                                        <li class="list-group-item"
                                            *ngFor="let option of element.options; let j = index">
                                            <input type="radio">
                                            <input [(ngModel)]="option.text" class="form-control"
                                                placeholder="Enter option text">
                                            <mat-icon class="form-builder-icon"
                                                (click)="removeOption(element.options, j)"
                                                svgIcon="heroicons_solid:trash" class="action-icon"></mat-icon>
                                        </li>
                                    </ul>
                                    <mat-icon class="form-builder-icon" svgIcon="mat_outline:add_circle"
                                        (click)="addOption(element.options)"></mat-icon>
                                </div>
                            </div>
                            <div *ngIf="element.type === 'submit'" class="flex">
                                <button [type]="element.type" class="btn btn-primary btn-block w-25">{{ element.label
                                    }}</button>
                            </div>
                            <!-- Action buttons shown only for the selected element -->
                            <div *ngIf="i === selectedElementIndex" class="form-builder-action">
                                <div class="edit-form-builder f-icon flex">
                                    <mat-icon (click)="openSettingsPanel(element)" svgIcon="heroicons_solid:cog"
                                        class="action-icon"></mat-icon>
                                </div>
                                <div class="trash-form-builder f-icon flex">
                                    <mat-icon (click)="deleteElement(i)" svgIcon="heroicons_solid:trash"
                                        class="action-icon"></mat-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div *ngIf="formElements.length === 0" class="placeholder-content text-center p-3">
                        <p>Drag your first form element here from the left.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<mat-sidenav-container class="example-container">
    <mat-sidenav #sidenav mode="side" class="sidenav" [(opened)]="opened">
        <div class="flex flex-col w-full overflow-auto bg-card">
            <div class="flex flex-row items-center px-6 h-15 min-h-15 text-white bg-dark">
                <div class="ml-1 text-1xl">Form Elements</div>
                <button class="ml-auto" mat-icon-button (click)="sidenav.close()">
                    <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
                </button>
            </div>
            <mat-nav-list>
                <a mat-list-item *ngFor="let field of elements" (click)="addFieldToDropZone(field)">
                    <mat-icon [svgIcon]="field.icon"></mat-icon>
                    <span class="nav-text text-capitalize">{{ field.name }}</span>
                </a>
            </mat-nav-list>
        </div>
    </mat-sidenav>
</mat-sidenav-container>

<!-- Settings Side Panel -->
<mat-sidenav-container class="settings-container">
    <mat-sidenav #settingsDrawer mode="side" position="end" class="sidenav form-builder-sidenav"
        [(opened)]="settingsDrawerOpened">
        <div class="flex flex-row items-center px-6 h-15 min-h-15 text-white bg-dark">
            <div class="ml-1 text-1xl">Form Setting</div>
            <button class="ml-auto" mat-icon-button (click)="settingsDrawer.close()">
                <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
            </button>
        </div>
        <div class="settings-panel">
            <!-- Bind the selectedElement to the settings panel component -->
            <app-settings-panel></app-settings-panel>
        </div>
    </mat-sidenav>
</mat-sidenav-container>

<ng-template #titleModel let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Form Builder</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label for="dateOfBirth">Title</label>
            <div class="input-group">
                <input id="title" class="form-control" [(ngModel)]="title" placeholder="Enter form name" name="title" />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" (click)="modal.close('Save click')"
            (click)="publishForm('publish')">Save</button>
    </div>
</ng-template>

<ng-template #background>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Form setting</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label for="fileInput" class="custom-file-upload btn btn-primary">Background Watermark</label>
            <input type="file" accept=".png,.jpg,.jpeg" id="fileInput" (change)="onBackgroundImageSelected($event)"
                #fileInput hidden [disabled]="backgroundColorSelected" />
        </div>
        <div class="mb-3" *ngIf="backgroundImage">
            <img [src]="backgroundImage" alt="Selected Image" class="img-thumbnail" />
            <button type="button" class="btn btn-danger mt-2" (click)="removeBackgroundImage()">Remove Image</button>
        </div>
        <div class="mb-3">
            <label for="colorPicker" class="btn btn-secondary">Background Color</label>
            <input class="ml-5" type="color" id="colorPicker" [(ngModel)]="backgroundColor"
                (change)="onBackgroundColorSelected($event)" [disabled]="backgroundImageSelected" />
            <button *ngIf="backgroundColor" type="btn btn-danger" class="btn"
                (click)="removeSelectedColor()">Remove</button>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" (click)="modalRef.close('Save click'); saveBg()">Save
            setting</button>
    </div>
</ng-template>
