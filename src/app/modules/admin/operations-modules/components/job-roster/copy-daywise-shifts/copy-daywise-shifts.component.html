    <div class="container py-4">
        <div class="text-center mb-4">
          <h5 class="font-weight-bold">Select Days to Copy</h5>
          <p class="text-muted small">Choose a month and select the days you want to copy</p>
        </div>
      
        <div class="d-flex justify-content-center mb-4">
            <div class="input-group w-auto">
                <div class="input-group-prepend">
                    <label class="input-group-text" for="monthSelect">Month</label>
                </div>
                <select class="custom-select select-month" style="width:300px" [(ngModel)]="selectedMonth" (change)="updateDaysForSelectedMonth()">
                    <option *ngFor="let month of months" [value]="month">{{ month }}</option>
                </select>
            </div>
        </div>
      
        <!-- Day Checkboxes in Card -->
        <div class="card border-0">
            <div class="card-body">
          
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <div class="day-checkbox p-2 rounded border text-center" *ngFor="let day of daysInMonth; let i = index"
                  [ngClass]="{ 'selected-day': selectedDaysMap[day] }" (click)="toggleDaySelection(day)"
                  style="width: 55px; cursor: pointer;">
                  {{ day }}
                </div>
              </div>
            </div>
        </div>
    </div>      

    <div class="modal-footer">
        <button type="button" class="btn btn-border-3" (click)="activeModal.dismiss('Cross click')">Cancel</button>
        <button type="button" class="btn btn-border-3" (click)="copyShift()">Copy Shift</button>
    </div>
</div>
