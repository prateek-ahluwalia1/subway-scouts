<div class="flex flex-col flex-auto min-w-0 main-body-watermark">
    <div class="flex-auto p-6">
        <div class="rounded-2xl common-style-for-cards">
            <div class="com-main" style="border-radius: 10px;">
                <div class="nav rounded-2xl">
                    <h4>Communication</h4>
                    <input type="text" name="text" placeholder="Search here" class="input" [(ngModel)]="searchText">
                </div>
                <div class="main pt-6 w-100">
                    <div class="page-navbar">
                        <!-- tabs -->
                        <div class="pcss3t pcss3t-effect-scale pcss3t-theme-1">
                            <!-- <ng-container *ngFor="let tab of tabs; let i = index">
                                <input type="radio" name="pcss3t" [checked]="i === 0" [id]="i">
                                <label (click)="getTabData(tab)" [for]="i"><i [class]="icons[i]"></i>{{ tab }}</label>
                            </ng-container> -->
                            <ul>
                                <li class="tab-content typography">
                                    <div class="row main_inner w-100 m-0">
                                        <ng-container *ngFor="let report of newArray | nameFilter:searchText">
                                            <div class="card p-0" *ngIf="report.enabled">
                                                <img class="card-img-top" [src]="report.image" alt="Card image" style="height: 200px;">
                                                <div class="card-body">
                                                    <h5 class="card-title">{{ report.name }}</h5>
                                                </div>
                                                <div class="card-footer bg-transparent border-0 ">
                                                    <button class="accept" (click)="jobTracker(report.url, report.name)">
                                                        Access Now
                                                    </button>
                                                </div>
                                            </div>
                                        </ng-container>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <!--/ tabs -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
