<div class="flex flex-col flex-auto min-w-0 main-body-watermark">
    <div class="flex-auto p-6">
        <div class="rounded-2xl common-style-for-cards">
            <div class="com-main" style="border-radius: 10px;">
                <div class="nav rounded-2xl">
                    <h4>Reports</h4>
                </div>
                <div class="main p-6 w-100">
                    <div class="row main_inner">
                        <div class="card p-0" *ngFor="let report of outlooks">
                            <img class="card-img-top" [src]="report.image" alt="Card image">
                            <div class="card-body">
                                <h4 class="card-title">{{ report.name }}</h4>
                                <p class="card-text">{{ report.text }}</p>
                                <div class="actions">
                                    <button (click)="email(report.url)" class="accept">
                                        Access Now
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="card p-0" *ngFor="let report of emails">
                            <img class="card-img-top" [src]="report.image" alt="Card image">
                            <div class="card-body">
                                <h4 class="card-title">{{ report.name }}</h4>
                                <p class="card-text">{{ report.text }}</p>
                                <div class="actions">
                                    <button (click)="goToEmail(report.url)" class="accept">
                                        Access Now
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
