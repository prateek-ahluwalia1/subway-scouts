<div class="flex flex-col flex-auto min-w-0 main-body-watermark">
    <!-- Main -->
    <div class="flex-auto p-6">
        <!-- CONTENT GOES HERE -->
        <div class="rounded-2xl">
            <div class="carDetails-page">
                <div class="runsheet-head" style="background-color: var(--tw-ring-offset-color) !important; border-radius: 13px;">
                    <div class="user-nav rounded-2xl">
                        <h4>Patrol Car Details</h4>
                        <mat-chip-list aria-label="Dog selection" class="dog_selection">
                            <mat-chip-list aria-label="Dog selection" class="dog_selection">
                                <button class="btn btn-border-3" (click)="addNewCar()">Add New</button>
                            </mat-chip-list>
                        </mat-chip-list>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table for detail -->
        <section>
            <div class="d-flex justify-content-end searchbar_main">
                <input type="text" placeholder="Search here.." class="searchbar" [(ngModel)]="searchText">
                <mat-icon>search</mat-icon>
            </div>

            <table class="table">
                <thead>
                    <th>Name</th>
                    <th>Actions</th>
                </thead>

                <tbody>
                    <tr *ngFor="let item of filteredCars || getCarDetails">
                        <td>{{item.name}}</td>
                        <td>   
                            <mat-icon svgIcon="mat_solid:edit" style="color: #00a37e;" (click)="editCarDetails(item.id)"></mat-icon>&nbsp;    
                            <mat-icon svgIcon="mat_solid:delete" style="color: #d1001f;" (click)="deleteCarDetails(item.id)"></mat-icon>&nbsp;
                            <mat-icon svgIcon="mat_solid:remove_red_eye" style="color: #1976D2;"></mat-icon>&nbsp;
                            <mat-icon svgIcon="mat_solid:arrow_circle_down" style="color: #FF9800;"></mat-icon>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</div>
