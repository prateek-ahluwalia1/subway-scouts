<div class="absolute inset-0 flex flex-col overflow-hidden main-body-watermark">
    <div class="p-4 rounded-2xl overflow-auto common-admin-customer-contractor">
        <div class="activity-log">
            <div class="user-main">
                <div class="job-track-nav">
                    <h3 style="width: 33%;">Audit Report</h3>
                    <mat-chip-list aria-label="Dog selection" class="dog_selection">

                        <app-date-range (dateRange)="getStartEnd($event)" [start]="start" [end]="end"></app-date-range>

                        <mat-chip (click)="getAuditReport()">
                            <span style="margin-right: 5px;">Get Reports</span>
                        </mat-chip>

                    </mat-chip-list>
                </div>
                <div class="row main mx-1" *ngIf="filteredAuditReport.length > 0">

                    <div class="col-12 d-flex justify-content-end searchbar_main">
                        <input type="text" placeholder="Search here.." [(ngModel)]="searchTerm" (keyup)="filterAuditReport()" class="searchbar">
                        <mat-icon style="top: 24px; position: absolute; right: 205px;">search</mat-icon>
                    </div>

                    <div class="row main" style="background-color: white; border-radius: 10px;">
                        <div class="col-12 p-0">
                            <table class="table w-100">
                                <thead class="guard_table">
                                    <tr class="table-row">
                                        <th>Admin Name</th>
                                        <th>Staff Name</th>
                                        <th>Site Name</th>
                                        <th>Date</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let item of filteredAuditReport">  
                                        <td>{{ item.admin?.name }}</td>
                                        <td>{{ item.guard_name ? item.guard_name : 'N/A' }}</td>
                                        <td>{{ item.site?.site_name ? item.site?.site_name : 'N/A' }}</td>
                                        <td>{{ item?.created_at | date:'dd-MM-yyyy hh:mm' }}</td>
                                        <td>
                                            <mat-icon (click)="downloadAudit(item.id)">picture_as_pdf</mat-icon>
                                            <mat-icon (click)="delAudit(item.id)" *ngIf="adminPermissions && adminPermissions.delete">delete_outline</mat-icon>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
