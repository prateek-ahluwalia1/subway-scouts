<div class="card mb-3 w-100">
    <div class=" font-size-lg text-capitalize font-weight-normal custom-body">
        <div class="job-track-nav job-track-body">
            <h5>Incident Report</h5>
            <mat-chip-list aria-label="Dog selection" class="dog_selection all-reports">

                <app-date-range (dateRange)="getStartEnd($event)" [start]="start" [end]="end"></app-date-range>


                <app-select-multiple-customer signleDouble="no" style="height: 43px; margin: 5px;"
                    (selectedCustomer)="selectedCus($event)" class="select-job-tacker" [dataArray]="customers"
                    [placeholderText]="'Select Customers'"></app-select-multiple-customer>
                <app-select-multiple-site signleDouble="no" style="height: 43px; margin: 5px;"
                    (selectedSite)="receiveDataFromChildSi($event)" class="select-job-tacker"
                    [dataArray]="singleSites" [placeholderText]="'Select Locations'"></app-select-multiple-site>
                <mat-chip (click)="getIncidentReport()">
                    <mat-icon svgIcon="mat_outline:search"></mat-icon>Search
                </mat-chip>
            </mat-chip-list>

          </div>
  
        
    </div>
    <div class="card-body" style="height: 400px;" >
        <table style="width:max-content; width: 100%;" id="example" class="table table-hover table-striped table-bordered table-responsive text-center" *ngIf="incidentReport.length > 0">
            <thead class="bg-emerald-400 live-operation-head">
                <tr>
                    <th>Staff Name</th>
                    <th>Location Name</th>
                    <th>Customer Name</th>
                    <th>Job Date</th>
                    <th>Start Time</th>
                    <th>Finish Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let report of incidentReport">
                    <td>
                        <p>{{ report.Guard_name }}</p>
                    </td>
                    <td>
                        <p>{{ report.site_name }}</p>
                    </td>
                    <td>
                        <p>{{ report.customer_name }}</p>
                    </td>
                    <td>
                        <p>{{ report.job_date }}</p>
                    </td>
                    <td>
                        <p>{{ report.job_start }}</p>
                    </td>
                    <td>
                        <p>{{ report.job_end }}</p>
                    </td>
                    <td>
                        <div class="d-flex incident-report-icon">
                            <p *ngFor="let repo of report.incident"
                                (click)="dowloadIncidentReport(repo.incident_id)">
                                <mat-icon>picture_as_pdf</mat-icon>
                            </p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>


</div>
