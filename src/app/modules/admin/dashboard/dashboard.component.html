<div class="app-main__outer p-3 w-100 main-body-watermark">
    <div class="app-main__inner">
        <div class="tabs-animation">
            <div class="card no-shadow bg-transparent no-border rm-borders mb-3">
                <div class="card">
                    <div class="row">
                        <div class="col-12">
                            <div class="pt-0 pb-0 card-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item" *ngFor="let item of [
                                        { heading: 'Active Sites', subheading: 'Current Week', value: activeSites, progressClass: 'bg-primary',textClass: 'text-primary' },
                                        { heading: 'Active Jobs', subheading: 'Current Day', value: ongoing, progressClass: 'bg-success',textClass: 'text-success' },
                                        { heading: 'Completed Jobs', subheading: 'Current Week', value: completedJobCount, progressClass: 'bg-danger',textClass: 'text-danger' },
                                        { heading: 'Upcoming Jobs', subheading: 'Total Upcoming Jobs', value: upcoming_jobs, progressClass: 'bg-focus',textClass: 'text-focus' }
                                    ]">
                                        <div class="widget-content p-0">
                                            <div class="widget-content-outer">
                                                <div class="widget-content-wrapper">
                                                    <div class="widget-content-left">
                                                        <div class="widget-heading">{{ item.heading }}</div>
                                                        <div class="widget-subheading">{{ item.subheading }}</div>
                                                    </div>
                                                    <div class="widget-content-right">
                                                        <div class="widget-numbers" [ngClass]="item.textClass">{{
                                                            item.value }}</div>
                                                    </div>
                                                </div>
                                                <div class="widget-progress-wrapper">
                                                    <div class="progress-bar-sm progress-bar-animated-alt progress">
                                                        <div class="progress-bar" [ngClass]="item.progressClass"
                                                            role="progressbar" aria-valuenow="43" aria-valuemin="0"
                                                            aria-valuemax="100" style="width: 43%;"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <!-- <div class="col-6">
                            <app-journal></app-journal>
                        </div> -->
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-12 col-md-7 col-xl-7 px-0">
                    <div class="mb-3 card" id="fullscreenDiv">
                        <div class="card-header-tab card-header" style="justify-content:space-between;">
                            <div class="card-header-title font-size-lg text-capitalize font-weight-normal">
                                Job Roster Monthly Overview
                            </div>
                            <div class="btn" (click)="toggleFullScreen()">
                                <i class="fa" style="color: #fff" [class.fa-compress]="isFullScreen"
                                    [class.fa-expand]="!isFullScreen"></i>
                            </div>
                        </div>
                        <div class="card-body">
                            <ng-container *ngIf="ChartColumnOptions">
                                <apx-chart #chartColumn [series]="ChartColumnOptions.series"
                                    [chart]="ChartColumnOptions.chart" [dataLabels]="ChartColumnOptions.dataLabels"
                                    [plotOptions]="ChartColumnOptions.plotOptions" [yaxis]="ChartColumnOptions.yaxis"
                                    [legend]="ChartColumnOptions.legend" [fill]="ChartColumnOptions.fill"
                                    [stroke]="ChartColumnOptions.stroke" [tooltip]="ChartColumnOptions.tooltip"
                                    [xaxis]="ChartColumnOptions.xaxis"></apx-chart>
                            </ng-container>
                        </div>
                    </div>
                </div>

                <div class="col-sm-12 col-md-5 col-xl-5">
                    <div class="mb-3 card" id="fullscreenDiv2">

                            </div>
                        </div>
                        <div class="card-body">
                            <ng-container *ngIf="ChartLineOptions" style="background-color:#fff">
                                <div id="chart-col-2">
                                    <apx-chart #chartLine [series]="ChartLineOptions.series"
                                        [chart]="ChartLineOptions.chart" [xaxis]="ChartLineOptions.xaxis"
                                        [stroke]="ChartLineOptions.stroke" [colors]="ChartLineOptions.colors"
                                        [dataLabels]="ChartLineOptions.dataLabels" [legend]="ChartLineOptions.legend"
                                        [markers]="ChartLineOptions.markers" [grid]="ChartLineOptions.grid"
                                        [yaxis]="ChartLineOptions.yaxis" [title]="ChartLineOptions.title"></apx-chart>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>

                    <div class="mb-3 card" id="fullscreenDiv3">

                            <div class="card-header-title">
                                <i class="header-icon lnr-rocket icon-gradient bg-tempting-azure"></i>

                            </div>
                            <div class="btn" (click)="toggleScreen3()">
                                <i class="fa" style="color: #fff" [class.fa-compress]="isFullScreen"

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="widget-content mt-2">

                                            <div class="widget-content-wrapper">

            <div class="row">
