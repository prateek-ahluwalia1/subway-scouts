<div class="absolute inset-0 flex flex-col main-body-watermark">
    <div class="flex-auto p-6">
        <div class="rounded-2xl common-style-for-cards">
            <div class="com-main" style="border-radius: 10px;">
                <div class="nav rounded-2xl">
                    <h4>Rates</h4>
                    <input type="text" name="text" placeholder="Search here" class="input" [(ngModel)]="searchText">
                </div>
                <div class="main p-6 w-100">
                    <div class="row main_inner">
                        <ng-container *ngFor="let rate of rates | nameFilter:searchText">
                            <div class="card p-0" *ngIf="rate.enabled">
                                <img class="card-img-top" [src]="rate.image" alt="Card image">
                                <div class="card-body">
                                    <h4 class="card-title">{{ rate.name }}</h4>
                                    <p class="card-text">{{ rate.text }}</p>
                                </div>
                                <div class="card-footer bg-transparent border-0">
                                    <button class="accept" [routerLink]="['./'+rate.url]">
                                        Access Now
                                    </button>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
