<div class="relative flex flex-auto w-full bg-card dark:bg-transparent">
    <ng-container *ngIf="mails && mails.length > 0; else noMails">
        <div class="relative flex flex-auto flex-col w-full min-w-0 lg:min-w-90 lg:max-w-90 border-r z-10">
            <div
                class="relative flex flex-0 items-center justify-between h-14 px-3 border-b bg-gray-50 dark:bg-transparent">
                <div class="flex items-center">
                    <button mat-icon-button (click)="mailboxComponent.drawer.toggle()">
                        <mat-icon [svgIcon]="'heroicons_outline:menu'"></mat-icon>
                    </button>
                </div>
                <div class="flex items-center">
                    <div class="flex items-center mr-3 text-md font-medium">
                        <span>{{ pagination.startIndex + 1 }}</span>
                        <span class="mx-1 text-secondary">-</span>
                        <span>{{ pagination.endIndex + 1 }}</span>
                    </div>
                    <a class="w-8 h-8 min-h-8" mat-icon-button [disabled]="!pagination.prevPage"
                        (click)="navigateToPage(pagination.prevPage)">
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
                    </a>
                    <a class="w-8 h-8 min-h-8" mat-icon-button [disabled]="!pagination.hasNext"
                        (click)="navigateToPage(pagination.nextPage)">
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:chevron-right'"></mat-icon>
                    </a>
                </div>
                <mat-progress-bar class="absolute inset-x-0 bottom-0 h-0.5" *ngIf="mailsLoading"
                    [mode]="'indeterminate'"></mat-progress-bar>
            </div>
            <div class="overflow-y-auto" #mailList>
                <ng-container *ngFor="let mail of mails; trackBy: trackByFn">
                    <a class="relative flex border-t first:border-0 hover:bg-hover" style="color:black" [routerLink]="[mail.id]"
                        (click)="onMailSelected(mail)">
                        <div class="flex flex-col items-start justify-start w-full py-3 pr-4 pl-3 border-l-4 border-transparent"
                            [ngClass]="{'border-primary text-primary': !mail.isRead, 'bg-primary-50 dark:bg-black dark:bg-opacity-5': selectedMail && selectedMail.id === mail.id}">
                            <div class="flex items-center w-full">
                                <div class="mr-2 font-semibold truncate">{{ mail.from?.emailAddress?.name || '' }}</div>
                                <mat-icon class="mr-3 icon-size-4 text-red-500 dark:text-red-600"
                                    *ngIf="mail.importance === 'high'"
                                    [svgIcon]="'heroicons_solid:exclamation-circle'"></mat-icon>
                                <div class="ml-auto text-md text-right whitespace-nowrap text-hint">
                                    {{ mail.receivedDateTime | date:'LLL dd, yyyy hh:mm a' }}
                                </div>
                            </div>
                            <div class="flex items-center w-full mt-1">
                                <span class="leading-4 truncate">{{ mail.subject }}</span>
                                <div class="flex ml-auto pl-2"
                                    *ngIf="(mail.hasAttachments) || mail.categories.includes('Starred')">
                                    <mat-icon class="flex justify-center icon-size-4" *ngIf="mail.hasAttachments"
                                        [svgIcon]="'heroicons_solid:paper-clip'"></mat-icon>
                                    <mat-icon
                                        class="flex justify-center icon-size-4 ml-1 text-orange-500 dark:text-orange-400"
                                        *ngIf="mail.categories.includes('Starred')"
                                        [svgIcon]="'heroicons_solid:star'"></mat-icon>

                                    <mat-icon
                                        class="flex justify-center icon-size-4 ml-1 text-red-500 dark:text-red-400"
                                        *ngIf="mail.flag.flagStatus === 'flagged'"
                                        [svgIcon]="'heroicons_outline:flag'"></mat-icon>
                                </div>
                            </div>
                            <div class="mt-2 leading-normal line-clamp-2 text-secondary" [innerHTML]="mail.bodyPreview">
                            </div>
                        </div>
                    </a>
                </ng-container>
            </div>
        </div>
    </ng-container>
    <ng-template #noMails>
        <div
            class="z-100 absolute inset-0 flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
            <mat-icon class="icon-size-24" [svgIcon]="'heroicons_outline:mail'"></mat-icon>
            <div class="mt-4 text-2xl font-semibold tracking-tight text-secondary">There are no e-mails</div>
        </div>
    </ng-template>
    <ng-container *ngIf="mails && mails.length > 0">
        <div class="flex-auto"
            [ngClass]="{'z-20 absolute inset-0 lg:static lg:inset-auto overflow-auto flex': selectedMail && selectedMail.id, 'hidden lg:flex': !selectedMail || !selectedMail.id}">
            <router-outlet></router-outlet>
        </div>
    </ng-container>
</div>
