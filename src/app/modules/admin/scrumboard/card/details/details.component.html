<div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Stagging card detail</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="dismiss('cancel click')"></button>
</div>
<div class="modal-body">
    <form novalidate (ngSubmit)="saveProject()" [formGroup]="cardForm">
        <div class="col-12 p-0 pr-4">
            <div class="row my-2">
                <p class="col-4 flex align-items-center m-0">Assignee</p>
                <div class="col-4 flex align-items-center hover:bg-slate-200" *ngIf="!isAgentHave" (click)="addAgent()"
                    style="cursor: pointer;">
                    <mat-icon svgIcon="heroicons_outline:user-circle"></mat-icon>
                    <span>No assign</span>
                </div>
            </div>
            <mat-form-field class="form-field w-100" appearance="outline" *ngIf="isAgentHave">
                <mat-select placeholder="Select sale person" formControlName="saleperson_id" class="custom-mat-select">
                    <mat-option *ngFor="let agent of agents" [value]="agent.id">
                        {{agent.name}}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <div class="row">
                <mat-form-field class="form-field w-100" appearance="outline">
                    <mat-label>Description</mat-label>
                    <textarea matInput rows="5" cols="40" placeholder="What is this task about?"
                        formControlName="description"></textarea>
                </mat-form-field>
            </div>

            <div class="row my-3" *ngFor="let cmnt of comments">
                <div class="d-flex align-items-center usersitediv">
                    <div class="rounded-circle d-flex justify-content-center align-items-center text-uppercase font-weight-bold"
                        style="width: 56px; height: 54px; background-color: #e8e8e8;padding: 6px;">
                        {{ cmnt.admin.name.charAt(0) }}{{ cmnt.admin.name.charAt(1) }}
                    </div>
                    <div class="ms-2" style="position: relative;width: 100%;height: 100%;">
                        <p class="mb-1 site-p" style="font-size:16px">
                            {{ cmnt?.admin?.name }} <span style="font-size:11px">{{ getTimeAgo(cmnt.created_at)
                                }}</span> </p>

                        <p class="m-0" style="font-size:11px">
                            {{ cmnt.comment }}
                        </p>
                    </div>
                </div>
            </div>

            <div class="row add-comment-card">
                <mat-form-field class="form-field w-100" appearance="outline">
                    <mat-label>Feedback</mat-label>
                    <textarea matInput rows="3" cols="20" placeholder="Ask a question or post an update..."
                        formControlName="comment"></textarea>
                </mat-form-field>
                <!-- <span *ngIf="cardForm.get('comment').value" class="text-inherit text-xs">Press enter to add comment</span> -->
            </div>
            <button type="button" class="btn btn-outline-dark add-comment-btn" (click)="save()"
                *ngIf="cardForm.get('comment').value">Add</button>

        </div>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="dismiss('cancel click')">Cancel</button>
    <button type="button" class="btn btn-outline-dark" (click)="saveProject()">Save</button>
</div>
