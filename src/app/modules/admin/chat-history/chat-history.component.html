<div class="flex flex-col flex-auto min-w-0 main-body-watermark">
    <div class="flex-auto p-6">
        <div class="rounded-2xl chat-main"
            style="background-color: var(--tw-ring-offset-color) !important; border-radius: 10px;">
            <div class="user-nav rounded-2xl">
                <h4 class="ps-2 pt-2">Chat History</h4>
                <ul>
                    <li class="row" style="padding: 0;">
                        <label for="inputfromDate" class="col-form-label" style="width: 24% !important">From</label>
                        <div class="col-sm" style="padding-left: 0;">
                            <input type="date" class="form-control" id="inputfromDate" placeholder="Enter Date"
                                [(ngModel)]="curDate">
                        </div>
                    </li>
                    <li class="row" style="padding: 0;">
                        <label for="inputtoDate" class="col-sm-2 col-form-label" style="padding-right: 10px;">To</label>
                        <div class="col-sm pl-0">
                            <input type="date" class="form-control" id="inputtoDate" placeholder="Enter Date"
                                [(ngModel)]="selectedDate">
                        </div>
                    </li>
                    <li><mat-chip><mat-icon viewBox="0 0 30 30" svgIcon="today" (click)="today()"></mat-icon></mat-chip>
                    </li>
                    <li><mat-chip><i class="fa-solid fa-calendar-days" (click)="currentMonth()"
                                style="font-size: 20px; color:#64748B;"></i></mat-chip></li>
                    <li (click)="previousMonth()"><mat-chip><mat-icon
                                svgIcon="mat_outline:skip_previous"></mat-icon></mat-chip></li>
                    <li>
                        <mat-form-field class="w-100 p-0 select">
                            <mat-select class="ps-2 pe-5 single-select" placeholder="Select type" matNativeControl
                                name="type" [(ngModel)]="chat_type">
                                <mat-option class="w-100">Select type</mat-option>
                                <mat-option value="out" class="w-100">Sent</mat-option>
                                <mat-option value="in" class="w-100">Received</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </li>
                    <li style="padding: 4px 0px">
                        <mat-chip [matMenuTriggerFor]="menu" (click)="applyFilters()">
                            <mat-icon svgIcon="mat_outline:person_search"></mat-icon>
                            <span>Apply</span>
                        </mat-chip>
                    </li>
                    <li>
                        <mat-chip [matMenuTriggerFor]="menu">
                            <mat-icon viewBox="0 0 30 30" style="margin-right: 10px;">cloud_download</mat-icon>
                            <span>Export</span>
                        </mat-chip>
                        <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="makePdf()">PDF</button>
                            <button mat-menu-item>Excel</button>
                        </mat-menu>
                    </li>
                </ul>
            </div>
            <mat-chip-list class="flex justify-content-end bg-white">
                <div class="search-here m-2">
                    <mat-icon svgIcon="feather:search" class="search-icon"
                        style="color: #94a3b8 !important; margin: 4px 7px !important;"></mat-icon>
                    <input matInput placeholder="Search..." type="text" [(ngModel)]="search_term">
                </div>
            </mat-chip-list>
        </div>
        <section #content>
            <div class="show_table">
                <table class="datatables-sms table border-top">
                    <thead>
                        <tr>
                            <th style="width: 250px;">USER NAME</th>
                            <th style="width: 128px; text-align: center;">DATE</th>
                            <th style="width: 128px; text-align: center;">FROM</th>
                            <th style="width: 128px; text-align: center;">TO</th>
                            <th style="width: 90px;">STATUS</th>
                            <th style="width: 350px;">BODY</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container *ngIf="Filter.length === 0;">
                            <div>No result Found</div>
                        </ng-container>
                        <tr *ngFor="let sms of Filter; let i = index">
                            <td>
                                <div class="d-flex justify-content-left align-items-center">
                                    <div class="d-flex flex-column">
                                        <span class="fw-semibold">{{ sms.names }}</span>
                                        <small class="text-muted">{{ sms.email }}</small>
                                    </div>
                                </div>
                            </td>
                            <td>{{ date(sms.datetime) }}</td>
                            <td><span class="text-capitalize">{{ sms?.name }}</span></td>
                            <td>{{ sms.to_number }}</td>
                            <td>
                                <div *ngIf="sms.direction == 'out'; else other_content">
                                    <span class="badge bg-success" style="padding-bottom: 7px;">{{ sms.seen_status
                                        }}</span>
                                </div>
                                <ng-template #other_content>
                                    <span class="badge bg-secondary" style="padding-bottom: 7px;">{{ sms.seen_status
                                        }}</span>
                                </ng-template>
                            </td>
                            <td style="overflow-wrap: anywhere;">{{ sms.msg_body }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
