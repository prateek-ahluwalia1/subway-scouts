<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent" (backdropClick)="onBackdropClicked()">

        <!-- Drawer -->
        <mat-drawer class="w-full sm:w-100 dark:bg-gray-900" [mode]="drawerMode" [opened]="false" [position]="'end'"
            [disableClose]="true" #matDrawer>
            <router-outlet></router-outlet>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col bg-gray-100 dark:bg-transparent">

            <!-- Main -->
            <div class="flex flex-col flex-auto">

                <!-- Header -->
                <div
                    class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between p-3 sm:py-12 md:px-8 border-b bg-card dark:bg-transparent">
                    <!-- Title -->
                    <div class="flex items-center">
                        <div class="mr-2" type="button" style="background-color:gainsboro; padding: 8px" (click)="goBack()"><mat-icon svgIcon="arrow_back"></mat-icon></div>
                        <div class="text-4xl font-extrabold tracking-tight leading-none">File Manager</div>
                        <div class="flex items-center mt-0.5 font-medium text-secondary">

                            <!-- Breadcrumbs -->
                            <!-- <ng-container *ngIf="items">
                                <div class="flex items-center space-x-2">
                                    <a
                                        class="text-primary cursor-pointer"
                                        [routerLink]="['/users/file-manager']">Home
                                    </a>
                                    <div class="">/</div> -->
                            <!-- <ng-container *ngFor="let path of items; let last = last; trackBy: trackByFn">
                                        <ng-container *ngIf="!last">
                                            <a
                                                class="text-primary cursor-pointer"
                                                [routerLink]="['/users/file-manager/folders/', path.id]">{{path.name}}</a>
                                        </ng-container>
                                        <ng-container *ngIf="last">
                                            <div>{{path.name}}</div>
                                        </ng-container>
                                        <ng-container *ngIf="!last">
                                            <div class="">/</div>
                                        </ng-container>
                                    </ng-container> -->
                            <!-- </div>
                            </ng-container> -->
                        </div>
                    </div>
                    <!-- Actions -->
                    <div class="mt-4 sm:mt-0">
                    <input type="text" name="text" placeholder="Search here" class="input" [(ngModel)]="searchText"
                    (input)="performSearch()">
                    </div>
                </div>

                <!-- Items list -->
                <ng-container *ngIf="filteredItems && filteredItems.length > 0; else noItems">
                    <div class="p-6 md:p-8 space-y-8">
                        <!-- Folders -->
                        <ng-container *ngIf="items.length > 0">
                            <div>
                                <div class="flex items-center">
                                    <!-- <div class="mr-2" type="button" style="background-color:gainsboro; padding: 8px" (click)="goBack()"><mat-icon svgIcon="arrow_back"></mat-icon></div> -->
                                    <div class="font-medium">Files</div>
                                </div>
                                <div class="flex flex-wrap -m-2 mt-2">
                                    <ng-container *ngFor="let folder of filteredItems; trackBy:trackByFn">
                                        <div class="relative w-40 h-40 m-2 p-3 shadow rounded-2xl bg-card" style="height: 12rem !important;">
                                            <a class="z-10 absolute inset-0 flex flex-col p-4 cursor-pointer no-underline text-black">
                                                <div class="aspect-[9/6]">
                                                    <div class="flex items-center justify-center h-full">
                                                        <!-- Icon -->
                                                        <ng-container *ngIf="folder.type === 'png'">
                                                            <img src="assets/images/avatars/png-file.png" alt="PNG Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="folder.type === 'jpg' || folder.type === 'jpeg'">
                                                            <img src="assets/images/avatars/jpg-file.png" alt="JPG or JPEG Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="folder.type === 'xls'">
                                                            <img src="assets/images/avatars/xls-file.png" alt="XLS Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="folder.type === 'docs'">
                                                            <img src="assets/images/avatars/docs-file.png" alt="Docs Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="folder.type === 'txt'">
                                                            <img src="assets/images/avatars/txt-file.png" alt="TXT Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="folder.type === 'pdf'">
                                                            <img src="assets/images/avatars/pdf-file.png" alt="Pdf Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="folder.type === 'N/A'">
                                                            <img src="assets/images/avatars/no-image.jpg" alt="Null Image">
                                                        </ng-container>
                                                        <ng-container *ngIf="!(['png', 'jpg', 'jpeg', 'xls', 'docs', 'txt', 'pdf', 'N/A'].includes(folder.type))">
                                                            <img src="assets/images/avatars/no-format.png" alt="Default Image">
                                                        </ng-container>
                                                    </div>
                                                </div>
                                                <div
                                                    class="flex flex-col flex-auto justify-center text-center text-sm font-medium">
                                                    <div class="truncate" [matTooltip]="folder.name">{{folder.name}}</div>
                                                    <div class="truncate" [matTooltip]="folder.document_expire">Exp: {{folder.document_expire}}</div>
                                                    <!-- <ng-container *ngIf="folder.contents">
                                                        <div class="text-secondary truncate">{{folder?.contents}}</div>
                                                    </ng-container> -->

                                                    <div class="flex justify-center">
                                                        <div class="px-2" style="background-color: #00b2ca; color:white" (click)="downloadFile(folder.file,folder?.document_name)">Download</div>
                                                        <div class="px-2" style="background-color: #f36b1c; color:white" (click)="openRightSideModal(folder.id)">View</div>
                                                    </div>
                                                </div>
                                            </a>
                                        </div>
                                    </ng-container>
                                </div>
                            </div>
                        </ng-container>

                    </div>
                </ng-container>

                <!-- No items template -->
                <ng-template #noItems>
                    <!-- <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="default" color="#fff" type="line-spin-fade-rotating">
                        <p style="color: white">Please Wait...</p>
                    </ngx-spinner> -->
                    <div class="flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
                        <mat-icon class="icon-size-24" [svgIcon]="'heroicons_outline:folder-open'"></mat-icon>
                        <div class="mt-4 text-2xl font-semibold tracking-tight text-secondary">There are no items!</div>
                    </div>
                </ng-template>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>
