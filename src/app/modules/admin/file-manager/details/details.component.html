<div class="flex flex-col flex-auto">

    <!-- Close button -->
    <div class="flex items-center justify-content-between">
        <h5>{{ item.document_name }}</h5>
        <a mat-icon-button (click)="onCloseClick()">
            <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </a>
    </div>

    <!-- Preview -->
    <div class="mt-8 aspect-[9/6]">
        <div class="flex items-center justify-center h-full border rounded-lg bg-gray-50 dark:bg-card">
            <!-- <ng-container *ngIf="item?.type === 'folder'">
                <iframe [src]="file" style="width: 100%; height: 300px;"></iframe>
            </ng-container>
            <ng-container *ngIf="item?.type !== 'folder'">
                <iframe [src]="file" style="width: 100%; height: 300px;"></iframe>
            </ng-container> -->
            <ng-container *ngIf="item?.type === 'png' || item?.type === 'jpg' || item?.type === 'jpeg'; else noImageView">
                <img [src]="file" alt="" style="width: 100%; height: 300px;"
                onerror="this.src='assets/images/avatars/no-image.jpg'" />
            </ng-container>
            <ng-template #noImageView>
                    <iframe [src]="file" style="width: 100%; height: 360px;"></iframe>
            </ng-template>
        </div>
    </div>

    <!-- Name & Type -->
    <div class="flex flex-col items-start mt-8">
        <div class="text-xl font-medium">{{item?.document_name}}</div>
        <div class="mt-1 px-1.5 rounded text-sm font-semibold leading-5 text-white"
            [class.bg-red-600]="item.type === 'png' || item.type === 'PNG'"
            [class.bg-blue-600]="item.type === 'doc' || item.type === 'DOC'"
            [class.bg-green-600]="item.type === 'xls' || item.type === 'XLS'"
            [class.bg-gray-600]="item.type === 'txt' || item.type === 'TXT'"
            [class.bg-amber-600]="item.type === 'jpg' || item.type === 'JPG'"
            [class.bg-orange-600]="item.type === 'pdf' || item.type === 'PDF'">
            {{item?.type.toUpperCase()}}
        </div>
    </div>

    <!-- Information -->
    <div class="text-lg font-medium mt-8">Information</div>
    <div class="flex flex-col mt-4 border-t border-b divide-y font-medium">
        <div class="flex items-center justify-between py-3">
            <div class="text-secondary">Created At</div>
            <div>{{item?.created_at}}</div>
        </div>
        <div class="flex items-center justify-between py-3" *ngIf="item?.document_expire">
            <div class="text-secondary">Document Expire</div>
            <div>{{item?.document_expire}}</div>
        </div>
    </div>

    <!-- Actions -->
    <!-- <div class="grid grid-cols-2 gap-4 w-full mt-8">
        <button (click)="downloadFile(item.file,item?.document_name)" class="flex-auto" mat-flat-button [color]="'primary'">
            Download
        </button>
    </div> -->

</div>
